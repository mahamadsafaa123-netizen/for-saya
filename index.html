<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕۆژە خوشەکەی سايه 🎓✨</title>
    <style>
        @font-face {
            font-family: 'Rabar_015';
            src: url('Rabar_015.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --primary: #8b5cf6;
            --spotify-green: #1db954;
            --bg-dark: #050508;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Rabar_015', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .main-container {
            width: 90%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.05);
            padding: 35px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            text-align: center;
        }

        .main-container.spotify-mode { background: #121212; }
        .content-section { display: none; }
        .content-section.active-view { display: block; }

        .album-art-container { width: 180px; height: 180px; margin: 0 auto 20px auto; border-radius: 16px; overflow: hidden; }
        .album-art { width: 100%; height: 100%; object-fit: cover; }

        .btn { width: 100%; padding: 15px; background: #8b5cf6; border: none; border-radius: 50px; color: white; font-weight: bold; cursor: pointer; margin-top: 15px; }
        input[type="text"] { width: 100%; padding: 15px; background: rgba(0,0,0,0.3); border: 1px solid #444; border-radius: 16px; color: #fff; text-align: center; margin-bottom: 10px; }

        .lyrics-viewport { height: 160px; overflow: hidden; position: relative; margin-top: 20px; }
        .lyrics-wrapper { position: absolute; width: 100%; top: 55px; transition: transform 0.4s ease; }
        .lyric-line { padding: 8px 0; color: #555; transition: all 0.3s; }
        .lyric-line.active { color: var(--spotify-green); transform: scale(1.05); font-size: 17px; }
    </style>
</head>
<body>

    <div class="main-container" id="morphContainer">
        <div class="content-section active-view" id="sec1">
            <h3>سیستەمی پاراستنی توند</h3>
            <input type="text" id="passInput" placeholder="وشەی نهێنی بنووسە">
            <button class="btn" onclick="checkPassword()">چوونە ژۆرێ</button>
        </div>

        <div class="content-section" id="sec2">
            <h2>سلاو لەو شێرە</h2>
            <button class="btn" onclick="goToStage3()">کلیک لێرە بکە شێتە</button>
        </div>

        <div class="content-section" id="sec3">
            <div class="album-art-container">
                <img src="cover.PNG" onerror="this.onerror=null; this.src='cover.png';" alt="Saya" class="album-art">
            </div>
            <button class="btn" onclick="toggleAudio()">تشغيل الأغنية</button>
            <div class="lyrics-viewport">
                <div class="lyrics-wrapper" id="lyricsWrapper">
                    <div class="lyric-line" data-time="0">🎵 مۆسیقای دەستپێک...</div>
                    <div class="lyric-line" data-time="18">( سايه ) ... ئازادی پیرۆز بێت !</div>
                    <div class="lyric-line" data-time="23">کۆتایی هات ماندوێتی ، کاتی کەیف و سەفایە .</div>
                    <div class="lyric-line" data-time="28">( سايه ) ... نیشانەی سەرکەوتن !</div>
                    <div class="lyric-line" data-time="32">پەڕتووکەکان دابخە ، خەم و بێتاقەتی بڕوا .</div>
                    <div class="lyric-line" data-time="33.5">ئەمڕۆ ڕۆژی تۆیە ، کاتی شایی و پشووە .</div>
                </div>
            </div>
        </div>
    </div>

    <audio id="mainAudio" src="song.mp3"></audio>

    <script>
        const audio = document.getElementById('mainAudio');
        function checkPassword() { if(document.getElementById('passInput').value === 'بژی حەمە') switchSection('sec1', 'sec2'); }
        function goToStage3() { document.getElementById('morphContainer').classList.add('spotify-mode'); switchSection('sec2', 'sec3'); audio.play(); }
        function switchSection(curr, next) { document.getElementById(curr).classList.remove('active-view'); document.getElementById(next).classList.add('active-view'); }
        function toggleAudio() { audio.paused ? audio.play() : audio.pause(); }
        audio.addEventListener('timeupdate', () => {
            document.querySelectorAll('.lyric-line').forEach((line, i) => {
                if (audio.currentTime >= parseFloat(line.getAttribute('data-time'))) {
                    document.querySelectorAll('.lyric-line').forEach(l => l.classList.remove('active'));
                    line.classList.add('active');
                    document.getElementById('lyricsWrapper').style.transform = `translateY(${i * -35}px)`;
                }
            });
        });
    </script>
</body>
</html>
