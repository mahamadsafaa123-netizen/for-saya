<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڕۆژە خوشەکەی سايه 🎓✨</title>
    <style>
        /* ... (نفس الستايل السابق الخاص بك) ... */
        body { background-color: #050508; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .main-container { width: 90%; max-width: 420px; background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 20px; text-align: center; }
        .album-art { width: 180px; height: 180px; border-radius: 15px; object-fit: cover; margin-bottom: 20px; }
        .btn { padding: 15px 30px; background: #8b5cf6; border: none; border-radius: 50px; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div class="main-container">
        <div id="sec3">
            <div class="album-art-container">
                <img src="cover.PNG" 
                     onerror="this.onerror=null; this.src='IMG_7559.png';" 
                     alt="Saya Graduation" 
                     class="album-art" 
                     id="albumArt">
            </div>
            
            <h2 style="color: #fff;">Zakaria Abdulla - Saya</h2>
            <p style="color: #b3b3b3;">پەیامی سەرکەوتن</p>
            
            <button class="btn" onclick="toggleAudio()">تشغيل الأغنية</button>
        </div>
    </div>

    <audio id="mainAudio" src="song.mp3"></audio>

    <script>
        function toggleAudio() {
            const audio = document.getElementById('mainAudio');
            audio.play();
        }
    </script>
</body>
</html>
